---
# Builds this fork (upstream Mullvad plus the extra local networks patch) against
# the newest upstream release, once a day and on demand.
#
# What it does:
#   1. Fetches upstream (mullvad/mullvadvpn-app) and picks the newest stable
#      desktop release tag (YYYY.N), unless a tag is given as an input.
#   2. Skips the run if artifacts for that release already exist, so the daily
#      schedule only does work when upstream has actually released something.
#   3. In each build job, applies this fork's changes onto that release with
#      ci/apply-extra-lan-patch.sh (a three-way merge of the fork's net diff,
#      which also regenerates the Rust constant from extra-lan-networks.txt),
#      runs the talpid-types tests, and builds.
#   4. Uploads the Linux .deb/.rpm (built inside Mullvad's own build container)
#      and the Windows installer .exe as workflow artifacts.
#
# Nothing is pushed to this repository. Pushing a branch built from an upstream
# release is not possible from Actions: such a branch necessarily changes files
# under .github/workflows/, and the automatic GITHUB_TOKEN is never allowed to
# create or update workflow files, with no permission setting that lifts it.
# To reproduce a build locally instead, run the same script by hand:
#
#   ci/apply-extra-lan-patch.sh <tag> && ./build.sh --optimize
#
# If the patch does not apply cleanly the run fails and GitHub emails the
# repository owner. Resolve it locally, commit, and re-run.
#
# Notes for the fork owner:
#   - GitHub only runs `schedule` triggers from the default branch, and it
#     disables scheduled workflows on forks until you enable them once under
#     the Actions tab. It also pauses them after 60 days without repo activity.
#   - macOS is not built here. Use the local command above.
#   - The networks to treat as local come from extra-lan-networks.txt in the
#     repository root. Edit that file, commit, and run this workflow.
#   - See docs/fork-tailscale-lan.md for the full story.
name: Sync Tailscale LAN patch with upstream
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Upstream release tag to build (default is the newest stable YYYY.N tag)
        type: string
        required: false
      force:
        description: Build even if artifacts for that release already exist
        type: boolean
        default: false
      build_linux:
        description: Build Linux packages
        type: boolean
        default: true
      build_windows:
        description: Build the Windows installer
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    name: Pick upstream release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      container_image: ${{ steps.pick.outputs.container_image }}
      skip: ${{ steps.built.outputs.skip }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Fetch upstream tags
        run: |
          git remote add upstream https://github.com/mullvad/mullvadvpn-app.git
          git fetch --no-tags upstream '+refs/tags/*:refs/remotes/upstream-tags/*'

      - name: Pick upstream release tag
        id: pick
        env:
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_TAG" ]; then
            tag="$REQUESTED_TAG"
          else
            tag=$(git for-each-ref --format='%(refname:strip=3)' refs/remotes/upstream-tags/ \
              | grep -E '^[0-9]{4}\.[0-9]+$' \
              | sort -t. -k1,1n -k2,2n \
              | tail -n1)
          fi
          if [ -z "$tag" ] || ! git rev-parse --verify --quiet "refs/remotes/upstream-tags/$tag" >/dev/null; then
            echo "::error::Upstream tag '$tag' not found"
            exit 1
          fi
          echo "Using upstream tag $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Build Linux inside the container that release itself was built with.
          image=$(git show "refs/remotes/upstream-tags/$tag:building/linux-container-image.txt")
          echo "container_image=$image" >> "$GITHUB_OUTPUT"

      - name: Skip releases that were already built
        id: built
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.pick.outputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ "$FORCE" = "true" ]; then
            echo "Forced; building regardless of existing artifacts."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          names=$(gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | .name' || true)
          skip=true
          for platform in linux windows; do
            if ! grep -qx "mullvad-tailscale-lan-$TAG-$platform" <<<"$names"; then
              skip=false
            fi
          done
          if [ "$skip" = "true" ]; then
            echo "Artifacts for $TAG already exist; nothing to do."
            echo "Re-run with the 'force' input to rebuild." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  build-linux:
    name: Build Linux packages
    needs: prepare
    if: |
      needs.prepare.outputs.skip != 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.build_linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: ${{ needs.prepare.outputs.container_image }}
    steps:
      # Fix for HOME path overridden by GH runners when building in containers, see:
      # https://github.com/actions/runner/issues/863
      - name: Fix HOME path
        run: echo "HOME=/root" >> $GITHUB_ENV

      - name: Checkout fork
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Apply the fork's changes onto the release
        run: |
          git config --global --add safe.directory '*'
          ./ci/apply-extra-lan-patch.sh "${{ needs.prepare.outputs.tag }}"

      - name: Checkout submodules
        run: git submodule update --init --depth=1

      - name: Verify the extra networks
        run: cargo test --locked -p talpid-types

      - name: Build app
        run: |
          export CARGO_TARGET_DIR=target/
          ./build.sh --optimize

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mullvad-tailscale-lan-${{ needs.prepare.outputs.tag }}-linux
          path: |
            ./dist/*.deb
            ./dist/*.rpm
          if-no-files-found: error

  build-windows:
    name: Build Windows installer
    needs: prepare
    if: |
      needs.prepare.outputs.skip != 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.build_windows)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      # By default, the longest path a filename can have in git on Windows is 260 characters.
      - name: Set git config for long paths
        run: git config --system core.longpaths true

      - name: Checkout fork
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Apply the fork's changes onto the release
        shell: bash
        run: ./ci/apply-extra-lan-patch.sh "${{ needs.prepare.outputs.tag }}"

      # Installs msbuild, protoc, Node, the 32-bit Rust target and the Windows
      # submodules. This is the same action upstream's CI uses to build the app.
      - uses: ./.github/actions/mullvad-build-env

      - name: Verify the extra networks
        shell: bash
        run: cargo test --locked -p talpid-types

      - name: Build app
        shell: bash
        run: ./build.sh --optimize

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mullvad-tailscale-lan-${{ needs.prepare.outputs.tag }}-windows
          path: .\dist\*.exe
          if-no-files-found: error
